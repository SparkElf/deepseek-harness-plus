- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-deepseek
        config:
          baseURL: !!js process.env.DSH_SNAPSHOT_BASE_URL
          thinking: enabled
          reasoningEffort: low
          # The local SSE fixture writes every 400 ms and ends after 1.6 s.
          streamIdleTimeoutMs: 1000
      - id: agent-spine
        config:
          agents:
            - id: main
              provider: deepseek-official
              model: deepseek-v4-flash
              cwd: !!js process.cwd()
          workspaceContext: false
          persona: 'Keyless DeepSeek adapter defaults snapshot.'
      - id: persistence
        config:
          root: './.sessions'
