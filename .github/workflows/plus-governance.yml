name: Plus governance

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-evidence:
    name: Required PR evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || ''
            const required = [
              '## Product design',
              '## Architecture',
              '## Implementation',
              '## Code review',
              '## Test governance',
              '## Verification',
              '## AI committee review',
              '## Diff records',
            ]
            const missing = required.filter((heading) => !body.includes(heading))
            if (missing.length) core.setFailed('Missing required pull request sections: ' + missing.join(', '))
  metadata:
    name: Diff and composition metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:plus-governance
