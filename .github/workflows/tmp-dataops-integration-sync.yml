name: Temporary DataOps integration sync

on:
  push:
    branches: [feat/dataops-oauth-integration]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dataops-oauth-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Align browser callback with the actual DSH web origin
        run: |
          python - <<'PY'
          from pathlib import Path

          host = Path('packages/mcp/dataops-integration/src/index.ts')
          text = host.read_text()
          marker = "function parseTokenResponse(value: unknown): TokenResponse {\n"
          helper = """function callbackOriginOf(request: IncomingMessage, response: ServerResponse): string | undefined {
            const requestUrl = new URL(request.url ?? CONNECT_PATH, 'http://dsh.local')
            const rawOrigin = requestUrl.searchParams.get('origin') ?? ''
            let candidate: URL
            try {
              candidate = new URL(rawOrigin)
            } catch {
              sendJson(response, 400, { error: 'The DSH browser origin is invalid.' })
              return undefined
            }
            const requestHost = request.headers.host?.trim().toLowerCase() ?? ''
            if (!['http:', 'https:'].includes(candidate.protocol)
              || candidate.username !== ''
              || candidate.password !== ''
              || candidate.pathname !== '/'
              || candidate.search !== ''
              || candidate.hash !== ''
              || candidate.host.toLowerCase() !== requestHost) {
              sendJson(response, 400, { error: 'The DSH browser origin does not match this DSH host.' })
              return undefined
            }
            return candidate.origin
          }

          """
          if 'function callbackOriginOf(' not in text:
              if marker not in text:
                  raise SystemExit('host source: parseTokenResponse anchor not found')
              text = text.replace(marker, helper + marker, 1)
          old = """      prunePending()
                const state = randomBytes(32).toString('base64url')
                const verifier = randomBytes(32).toString('base64url')
                const challenge = createHash('sha256').update(verifier, 'ascii').digest('base64url')
                const redirectUri = `http://127.0.0.1:${String(ctx.webServer.port)}${CALLBACK_PATH}`
          """.replace('                ', '      ')
          new = """      prunePending()
                const callbackOrigin = callbackOriginOf(request, response)
                if (callbackOrigin === undefined) return
                const state = randomBytes(32).toString('base64url')
                const verifier = randomBytes(32).toString('base64url')
                const challenge = createHash('sha256').update(verifier, 'ascii').digest('base64url')
                const redirectUri = `${callbackOrigin}${CALLBACK_PATH}`
          """.replace('                ', '      ')
          if old in text:
              text = text.replace(old, new, 1)
          elif 'const redirectUri = `http://127.0.0.1:' in text:
              raise SystemExit('host source: connect block changed unexpectedly')
          host.write_text(text)

          ui = Path('packages/mcp/dataops-integration/src/client/DataOpsSection.tsx')
          text = ui.read_text()
          old = """    const popup = window.open(CONNECT_PATH, 'dsh-dataops-authorization', 'popup,width=720,height=760')
          """
          new = """    const connectUrl = new URL(CONNECT_PATH, window.location.origin)
                connectUrl.searchParams.set('origin', window.location.origin)
                const popup = window.open(connectUrl.toString(), 'dsh-dataops-authorization', 'popup,width=720,height=760')
          """.replace('                ', '    ')
          if old in text:
              text = text.replace(old, new, 1)
          ui.write_text(text)

          spec = Path('packages/mcp/dataops-integration/tests/dataops-integration.spec.ts')
          text = spec.read_text()
          old = """    const connect = await fetch(`http://127.0.0.1:${String(localPort)}/integrations/dataops/connect`, { redirect: 'manual' })
          """
          new = """    const dshOrigin = `http://127.0.0.1:${String(localPort)}`
                const connect = await fetch(`${dshOrigin}/integrations/dataops/connect?origin=${encodeURIComponent(dshOrigin)}`, { redirect: 'manual' })
          """.replace('                ', '    ')
          if old in text:
              text = text.replace(old, new, 1)
          spec.write_text(text)
          PY
      - name: Register dual-half package in TypeScript aggregates
        run: |
          python - <<'PY'
          from pathlib import Path
          needle = '    { "path": "./packages/mcp/mcp-client" },\n'
          addition = needle + '    { "path": "./packages/mcp/dataops-integration" },\n'
          for filename in ['tsconfig.host.json', 'tsconfig.client.json']:
              path = Path(filename)
              text = path.read_text()
              if './packages/mcp/dataops-integration' in text:
                  continue
              if needle not in text:
                  raise SystemExit(f'{filename}: mcp-client aggregate anchor not found')
              path.write_text(text.replace(needle, addition, 1))
          PY
      - name: Refresh workspace metadata
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm run verify-client-packages --fix
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile
      - name: Focused DataOps integration tests
        run: pnpm exec vitest run packages/mcp/dataops-integration/tests/dataops-integration.spec.ts packages/mcp/dataops-integration/tests/loader-composition.spec.ts packages/mcp/dataops-integration/tests/apply.client.spec.ts
      - name: Commit generated and web-origin changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml tsconfig.host.json tsconfig.client.json packages/mcp/dataops-integration
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'build(mcp): sync DataOps integration metadata'
          git push origin HEAD:feat/dataops-oauth-integration
