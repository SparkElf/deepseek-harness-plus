# Remove the rejected Plus rc9 root bundle while npm still permits withdrawal.
name: Retire broken Plus rc9

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  PACKAGE: '@sparkelf/dsh-plus'
  BROKEN_VERSION: '0.1.0-rc.9'
  REPLACEMENT_VERSION: '0.1.0-rc.10'

jobs:
  retire:
    name: Retire broken Plus root bundle version
    runs-on: ubuntu-24.04
    environment: npm-publish
    concurrency:
      group: Release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Verify exact replacement and broken version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PREFER_ONLINE: 'true'
        run: |
          set -euo pipefail
          normalize='if type == "array" then .[0] else . end'
          replacement=$(npm view "$PACKAGE@$REPLACEMENT_VERSION" version --json | jq -r "$normalize")
          latest=$(npm view "$PACKAGE" dist-tags.latest --json | jq -r "$normalize")
          broken=$(npm view "$PACKAGE@$BROKEN_VERSION" version --json | jq -r "$normalize")
          test "$replacement" = "$REPLACEMENT_VERSION"
          test "$latest" = "$REPLACEMENT_VERSION"
          test "$broken" = "$BROKEN_VERSION"

      - name: Unpublish broken root bundle and verify withdrawal
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PREFER_ONLINE: 'true'
        run: |
          set -euo pipefail
          npm unpublish "$PACKAGE@$BROKEN_VERSION" --force
          removed=false
          for attempt in 1 2 3 4 5 6; do
            if ! npm view "$PACKAGE@$BROKEN_VERSION" version --json >/dev/null 2>&1; then
              removed=true
              break
            fi
            if [ "$attempt" -lt 6 ]; then sleep 5; fi
          done
          test "$removed" = true
          latest=$(npm view "$PACKAGE" dist-tags.latest --json | jq -r 'if type == "array" then .[0] else . end')
          test "$latest" = "$REPLACEMENT_VERSION"
