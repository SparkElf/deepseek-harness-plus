name: Temporary MCP lockfile sync

on:
  push:
    branches:
      - feat/mcp-credential-auth
    paths:
      - packages/mcp/mcp-client/package.json
      - .github/workflows/tmp-mcp-lockfile.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mcp-credential-auth
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build(mcp): sync lockfile"
          git push origin HEAD:feat/mcp-credential-auth
