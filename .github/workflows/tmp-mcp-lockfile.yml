name: Temporary MCP lockfile sync

on:
  push:
    branches:
      - feat/mcp-credential-auth
    paths:
      - packages/mcp/mcp-client/package.json
      - .github/workflows/tmp-mcp-lockfile.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mcp-credential-auth
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Remove unrelated lockfile metadata refresh
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pnpm-lock.yaml')
          text = path.read_text()
          line = "\n    deprecated: this version has critical issues, please update to the latest version"
          count = text.count(line)
          if count != 2:
              raise SystemExit(f"expected exactly 2 generated deprecated metadata lines, found {count}")
          path.write_text(text.replace(line, '', 2))
          PY
      - name: Verify frozen lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Commit narrowed lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already narrow"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build(mcp): narrow lockfile sync"
          git push origin HEAD:feat/mcp-credential-auth
