name: Issue policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    name: Issue policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/issue-management/policy.mjs pr

  attachment-fixture-candidate:
    name: Attachment fixture candidate patch
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 82 && github.head_ref == 'feat/document-attachments'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/attachment-fixture-candidate
          fetch-depth: 0

      - name: Apply exact fixture patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/client/connection/src/client/fixture.ts')
          text = path.read_text()

          old_import = "import type { AttachmentIdType, ImageAttachmentRef } from '@deepseek-ai/dsh-attachment'"
          new_import = "import type { AttachmentIdType, DocumentAttachmentRef, ImageAttachmentRef } from '@deepseek-ai/dsh-attachment'"
          if text.count(old_import) != 1:
              raise SystemExit('fixture attachment import did not match exactly once')
          text = text.replace(old_import, new_import)

          old = '''        const durable: ContentBlock[] = content.map((block) => {
          if (block.type === 'text') return block
          const attachment: ImageAttachmentRef = {
            attachmentId: `fixture:${randomUuid()}` as AttachmentIdType,
            mediaType: block.mediaType,
            bytes: Math.max(
              1,
              Math.floor(block.data.length * 3 / 4)
              - (block.data.endsWith('==') ? 2 : block.data.endsWith('=') ? 1 : 0),
            ),
            width: 160,
            height: 90,
            ...block.name === undefined ? {} : { name: block.name },
          }
          attachments.set(String(attachment.attachmentId), { attachment, data: block.data })
          return { type: 'image', attachment }
        })'''
          new = '''        const durable: ContentBlock[] = content.map((block) => {
          if (block.type === 'text') return block
          const attachmentId = `fixture:${randomUuid()}` as AttachmentIdType
          const bytes = Math.max(
            1,
            Math.floor(block.data.length * 3 / 4)
            - (block.data.endsWith('==') ? 2 : block.data.endsWith('=') ? 1 : 0),
          )
          if (block.type === 'image') {
            const attachment: ImageAttachmentRef = {
              attachmentId,
              mediaType: block.mediaType,
              bytes,
              width: 160,
              height: 90,
              ...block.name === undefined ? {} : { name: block.name },
            }
            attachments.set(String(attachment.attachmentId), { attachment, data: block.data })
            return { type: 'image', attachment }
          }
          const attachment: DocumentAttachmentRef = {
            attachmentId,
            mediaType: block.mediaType,
            bytes,
            name: block.name,
          }
          return { type: 'document', attachment }
        })'''
          if text.count(old) != 1:
              raise SystemExit('fixture durable attachment block did not match exactly once')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- packages/client/connection/src/client/fixture.ts

      - name: Commit candidate patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/client/connection/src/client/fixture.ts
          git commit -m 'fix(connection): preserve document attachment kind in fixture'
          git push origin HEAD:fix/attachment-fixture-candidate
