# Publish the reviewed Plus npm closure from one exact plus-npm-v* tag.
name: Release publish (Plus)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  pack:
    name: Verify and pack Plus tarballs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Verify Plus release tag and package closure
        env:
          RELEASE_PUBLISH: 'true'
        run: |
          pnpm run release:verify --family plus
          pnpm run verify:plus-governance

      - name: Build
        run: pnpm run build

      - name: Verify package publication metadata
        run: pnpm run publint

      - name: Pack Plus release tarballs
        run: pnpm run release:pack --family plus --out dist/npm-plus --concurrency 4

      - name: Verify Plus tarball reproducibility
        run: |
          pnpm run release:pack --family plus --out dist/npm-plus-repeat --concurrency 4
          diff -qr dist/npm-plus dist/npm-plus-repeat
          rm -rf dist/npm-plus-repeat

      - uses: actions/upload-artifact@v4
        with:
          name: plus-npm-tarballs
          path: dist/npm-plus/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Plus to npm
    needs: pack
    runs-on: ubuntu-24.04
    environment: npm-publish
    concurrency:
      group: Release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Install release tooling (immutable, no package scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          name: plus-npm-tarballs
          path: dist/npm-plus

      - name: Publish tarballs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm run release:publish --family plus --from dist/npm-plus
