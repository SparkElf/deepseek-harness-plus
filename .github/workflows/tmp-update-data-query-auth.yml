name: Temporary data query auth design sync

on:
  push:
    branches: [docs/data-query-mcp-architecture]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/data-query-mcp-architecture
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Align generic credential semantics with implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          pairs = [
            (
              Path('.agents/notes/proposed/architecture/2026-08-23-mcp-data-query-architecture.md'),
              '| Generic MCP authentication | DSH credential service and MCP client | Resolves a credential reference, attaches current transport credentials, and reconnects after credential changes |',
              '| Generic MCP authentication | DSH credential service and MCP client | With a credential reference, resolves the current bearer credential at each HTTP request boundary; without one, sends no `Authorization` header |',
            ),
            (
              Path('.agents/notes/proposed/architecture/2026-08-23-mcp-data-query-architecture.zh.md'),
              '| 通用 MCP 鉴权 | DSH credential service and MCP client | 解析 credential reference、附加当前传输凭据，并在凭据变化后重连 |',
              '| 通用 MCP 鉴权 | DSH credential service and MCP client | 配置 credential reference 时在每次 HTTP 请求边界解析当前 bearer credential；未配置时不发送 `Authorization` header |',
            ),
          ]
          for path, old, new in pairs:
            text = path.read_text()
            if old not in text:
              if new in text:
                continue
              raise SystemExit(f'{path}: generic auth row anchor not found')
            path.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify-translation-pairing --write .agents/notes/proposed/architecture/2026-08-23-mcp-data-query-architecture.md
      - name: Commit bilingual contract alignment
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agents/notes/proposed/architecture/2026-08-23-mcp-data-query-architecture.md .agents/notes/proposed/architecture/2026-08-23-mcp-data-query-architecture.zh.md .agents/notes/proposed/architecture/2026-08-23-mcp-data-query-architecture.i18n.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: align MCP credential request semantics'
          git push origin HEAD:docs/data-query-mcp-architecture
