name: Issue lifecycle

on:
  issues:
    types:
      - opened
      - edited
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - closed
      - reopened
      - field_added
      - field_removed
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - review_requested
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read

concurrency:
  group: issue-lifecycle-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Issue lifecycle
    if: ${{ vars.DSH_ISSUE_APP_CLIENT_ID != '' && (github.event_name != 'pull_request_review' || (github.event.action == 'submitted' && github.event.review.state == 'changes_requested')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Create project token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.DSH_ISSUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DSH_ISSUE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Handle repository event
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node .github/issue-management/policy.mjs lifecycle

  fix-pr84-static-and-generated:
    name: Fix PR84 static and generated artifacts
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.number == 84 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/mineru-document-parsing'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DSH_TELEMETRY_DISABLED: '1'
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      CLEAN_BASE: 81bb8a28f539440004661dcc439b9241f7ef1a0d
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply exact convergence patch
        run: python .github/pr84-static-fix.py
      - name: Generate repository-owned artifacts
        shell: bash
        run: |
          pnpm run gen-cordis-catalog
          pnpm run gen-client-catalog
          pnpm run gen-config-catalog
          pnpm run gen-doc-graphs
          pnpm run gen-module-graph
          pnpm run verify-translation-pairing --write docs/subsystems/llm-streaming.md
          pnpm run verify-translation-pairing --write .agents/notes/implemented/feature/2026-08-24-mineru-document-parsing.md
          pnpm run verify-translation-pairing --write packages/attachment/document-parser/README.md
          pnpm run verify-translation-pairing --write packages/attachment/document-parser-mineru/README.md
      - name: Restore temporary files
        shell: bash
        run: |
          git show "${CLEAN_BASE}:.github/workflows/issue-lifecycle.yml" > .github/workflows/issue-lifecycle.yml
          rm .github/pr84-static-fix.py
      - name: Build corrected tree
        run: pnpm run build
      - name: Test document parser runtime
        run: pnpm exec vitest run packages/attachment/document-parser/tests/runtime.spec.ts
      - name: Test MinerU provider
        run: pnpm exec vitest run packages/attachment/document-parser-mineru/tests/provider.spec.ts
      - name: Test MinerU transport
        run: pnpm exec vitest run packages/attachment/document-parser-mineru/tests/transport.spec.ts
      - name: Test MinerU loader composition
        run: pnpm exec vitest run packages/attachment/document-parser-mineru/tests/loader-composition.spec.ts
      - name: Test Host persists parsed refs
        run: pnpm exec vitest run packages/host/apiproxy/tests/api-proxy-document-parsing.spec.ts -t 'persists parser outputs and appends only durable parsed references'
      - name: Test Host parser failure admission
        run: pnpm exec vitest run packages/host/apiproxy/tests/api-proxy-document-parsing.spec.ts -t 'maps parser failure to attachment-error and appends no user message'
      - name: Test Host over-budget admission
        run: pnpm exec vitest run packages/host/apiproxy/tests/api-proxy-document-parsing.spec.ts -t 'rejects over-budget complete Markdown before appending the user message'
      - name: Test Host aggregate Markdown budget
        run: pnpm exec vitest run packages/host/apiproxy/tests/api-proxy-document-parsing.spec.ts -t 'enforces the direct Markdown byte budget across every document in one submitted message'
      - name: Test LLM parsed Markdown projection
        run: pnpm exec vitest run packages/llm/llm/tests/parsed-document-content.spec.ts -t 'resolves complete durable Markdown into a delimited transient text block'
      - name: Test LLM nested tool-result projection
        run: pnpm exec vitest run packages/llm/llm/tests/parsed-document-content.spec.ts -t 'projects parsed documents recursively inside tool results'
      - name: Test LLM unparsed document honesty
        run: pnpm exec vitest run packages/llm/llm/tests/parsed-document-content.spec.ts -t 'keeps semantic honesty for an unparsed durable document'
      - name: Test LLM invalid UTF-8 rejection
        run: pnpm exec vitest run packages/llm/llm/tests/parsed-document-content.spec.ts -t 'rejects invalid UTF-8 parser Markdown instead of inserting replacement characters'
      - name: Test DeepSeek parsed-document adapter
        run: pnpm exec vitest run packages/llm/llm-deepseek/tests/parsed-document-adapter.spec.ts
      - name: Test pi-ai parsed-document adapter
        run: pnpm exec vitest run packages/llm/llm-pi-ai/tests/parsed-document-adapter.spec.ts
      - name: Diagnose cordis catalog
        id: static_cordis
        continue-on-error: true
        run: pnpm run verify-cordis-catalog
      - name: Diagnose client catalog
        id: static_client
        continue-on-error: true
        run: pnpm run verify-client-catalog
      - name: Diagnose config catalog
        id: static_config
        continue-on-error: true
        run: pnpm run verify-config-catalog
      - name: Diagnose export JSDoc
        id: static_jsdoc
        continue-on-error: true
        run: pnpm run verify-export-jsdoc
      - name: Diagnose doc graphs
        id: static_doc_graphs
        continue-on-error: true
        run: pnpm run verify-doc-graphs
      - name: Diagnose module graph
        id: static_module_graph
        continue-on-error: true
        run: pnpm run verify-module-graph
      - name: Diagnose README model experience
        id: static_model_experience
        continue-on-error: true
        run: pnpm run verify-package-readme-model-experience
      - name: Diagnose type equivalence
        id: static_type_equiv
        continue-on-error: true
        run: pnpm run verify-type-equiv
      - name: Diagnose translation pairing
        id: static_translation
        continue-on-error: true
        run: pnpm run verify-translation-pairing
      - name: Require diagnostic static gates
        if: always()
        shell: bash
        env:
          CORDIS: ${{ steps.static_cordis.outcome }}
          CLIENT: ${{ steps.static_client.outcome }}
          CONFIG: ${{ steps.static_config.outcome }}
          JSDOC: ${{ steps.static_jsdoc.outcome }}
          DOC_GRAPHS: ${{ steps.static_doc_graphs.outcome }}
          MODULE_GRAPH: ${{ steps.static_module_graph.outcome }}
          MODEL_EXPERIENCE: ${{ steps.static_model_experience.outcome }}
          TYPE_EQUIV: ${{ steps.static_type_equiv.outcome }}
          TRANSLATION: ${{ steps.static_translation.outcome }}
        run: |
          printf '%s\n' \
            "cordis=$CORDIS" \
            "client=$CLIENT" \
            "config=$CONFIG" \
            "jsdoc=$JSDOC" \
            "doc_graphs=$DOC_GRAPHS" \
            "module_graph=$MODULE_GRAPH" \
            "model_experience=$MODEL_EXPERIENCE" \
            "type_equiv=$TYPE_EQUIV" \
            "translation=$TRANSLATION"
          test "$CORDIS" = success
          test "$CLIENT" = success
          test "$CONFIG" = success
          test "$JSDOC" = success
          test "$DOC_GRAPHS" = success
          test "$MODULE_GRAPH" = success
          test "$MODEL_EXPERIENCE" = success
          test "$TYPE_EQUIV" = success
          test "$TRANSLATION" = success
      - name: Validate full static repository gates
        run: pnpm run check:ci:static
      - name: Commit verified generated tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(documents): close MinerU static and generated gates'
      - name: Refuse concurrent overwrite
        shell: bash
        run: |
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${HEAD_REF}" | cut -f1)"
          test "${REMOTE_HEAD}" = "${EXPECTED_HEAD}"
      - name: Push verified tree
        shell: bash
        run: git push origin "HEAD:refs/heads/${HEAD_REF}"
