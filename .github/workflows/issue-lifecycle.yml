name: Issue lifecycle

on:
  issues:
    types:
      - opened
      - edited
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - closed
      - reopened
      - field_added
      - field_removed
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - review_requested
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read

concurrency:
  group: issue-lifecycle-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Issue lifecycle
    if: ${{ vars.DSH_ISSUE_APP_CLIENT_ID != '' && (github.event_name != 'pull_request_review' || (github.event.action == 'submitted' && github.event.review.state == 'changes_requested')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Create project token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.DSH_ISSUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DSH_ISSUE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Handle repository event
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node .github/issue-management/policy.mjs lifecycle

  fix-pr84-static-and-generated:
    name: Fix PR84 static and generated artifacts
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.number == 84 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/mineru-document-parsing'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DSH_TELEMETRY_DISABLED: '1'
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      CLEAN_BASE: 81bb8a28f539440004661dcc439b9241f7ef1a0d
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply exact source and documentation fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def r(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1))
          r('packages/host/apiproxy/tests/api-proxy-document-parsing.spec.ts', 'const parse = options.parse ?? (data => Promise.resolve({', 'const parse = options.parse ?? (() => Promise.resolve({')
          r('packages/attachment/document-parser-mineru/src/provider.ts', '/** Select exactly one v1 Markdown and content-list output plus every extracted raster image. */\nexport function parseArchive(entries: Readonly<Record<string, Uint8Array>>): DocumentParseResult {', '/**\n * Select exactly one v1 Markdown and content-list output plus every extracted raster image.\n * @param entries - decompressed ZIP entries keyed by archive path.\n * @returns complete validated parser outputs with transient bytes.\n */\nexport function parseArchive(entries: Readonly<Record<string, Uint8Array>>): DocumentParseResult {')
          r('packages/host/apiproxy/src/document-parsing.ts', ' * attachment retention policy; no user event is appended by the caller.\n */\nexport async function parseDocumentRefs(', ' * attachment retention policy; no user event is appended by the caller.\n * @param ctx - Host context carrying the attachment store and optional parser runtime.\n * @param refs - durable original-document references in submitted order.\n * @returns immutable document references carrying durable parser artifacts when parsing is composed.\n */\nexport async function parseDocumentRefs(')
          r('packages/llm/llm/src/content.ts', '/** True when content contains a document whose complete Markdown is stored durably. */\nexport function contentHasParsedDocument(content: readonly ContentBlock[]): boolean {', '/**\n * Test whether typed content contains a durable parsed-document reference.\n * @param content - provider-neutral content blocks, including nested tool results.\n * @returns whether any document carries complete durable parsed Markdown.\n */\nexport function contentHasParsedDocument(content: readonly ContentBlock[]): boolean {')
          r('packages/llm/llm/src/content.ts', ' * while this provider request is assembled. A fresh mutable message array is\n * returned because provider GenerateOptions owns a mutable request snapshot.\n */\nexport async function projectRequestDocumentsWithAttachments(', ' * while this provider request is assembled. A fresh mutable message array is\n * returned because provider GenerateOptions owns a mutable request snapshot.\n * @param messages - durable provider-neutral messages in request order.\n * @param attachments - durable resolver for parser Markdown references.\n * @param signal - optional cancellation for attachment reads.\n * @returns a mutable transient request snapshot with every document projected to text.\n */\nexport async function projectRequestDocumentsWithAttachments(')
          r('scripts/gen-cordis-catalog.ts', "  attachments: 'attachment.md',\n  shell: 'shell.md',", "  attachments: 'attachment.md',\n  documentParser: 'attachment.md',\n  shell: 'shell.md',")
          r('scripts/gen-cordis-catalog.ts', "  EncodedImageAttachment: 'attachment.md',\n  ImageAttachmentRef: 'attachment.md',\n  SaveImageAttachment: 'attachment.md',\n  StoredImageAttachment: 'attachment.md',", "  EncodedImageAttachment: 'attachment.md',\n  FileAttachmentRef: 'attachment.md',\n  ImageAttachmentRef: 'attachment.md',\n  SaveFileAttachment: 'attachment.md',\n  SaveImageAttachment: 'attachment.md',\n  StoredFileAttachment: 'attachment.md',\n  StoredImageAttachment: 'attachment.md',\n  DocumentParserProvider: 'attachment.md',\n  DocumentParseRequest: 'attachment.md',\n  DocumentParseResult: 'attachment.md',")
          r('scripts/verify-package-readme-model-experience.ts', "  'packages/attachment/attachment-local': { kind: 'indirect', reason: 'The local backend delegates model request rendering to provider adapters.' },", "  'packages/attachment/attachment-local': { kind: 'indirect', reason: 'The local backend delegates model request rendering to provider adapters.' },\n  'packages/attachment/document-parser': { kind: 'indirect', reason: 'The parser seam supplies durable parser outputs; Host admission and LLM projection own model rendering.' },\n  'packages/attachment/document-parser-mineru': { kind: 'indirect', reason: 'The MinerU backend supplies parser output bytes; the parser seam, Host admission, and LLM projection own model rendering.' },")
          r('packages/attachment/document-parser/README.md', 'Indirectly through Host document admission and LLM request projection. Accepted parsed documents reach text-capable providers as complete UTF-8 Markdown between explicit document delimiters; session history retains only the originals and parser-artifact references. A submitted document batch whose aggregate parsed Markdown exceeds the configured direct-context budget is rejected rather than truncated.', 'Indirectly, through Host document admission and LLM request projection.')
          r('packages/attachment/document-parser-mineru/README.md', "Indirectly through the document parser seam. MinerU's complete Markdown is the version-one provider-neutral representation sent to text-capable models after durable resolution. `content_list` and extracted images remain durable for later block/page/search tooling but are not automatically injected into every model request.", 'Indirectly, through the document-parser seam and Host-owned durable Markdown projection.')
          r('packages/attachment/document-parser/README.zh.md', '[`@deepseek-ai/dsh-attachment`](../attachment/README.zh.md)', '[`@deepseek-ai/dsh-attachment`](../attachment/README.md)')
          r('packages/attachment/document-parser-mineru/README.zh.md', '[`documentParser`](../document-parser/README.zh.md)', '[`documentParser`](../document-parser/README.md)')
          zh_block = '```text\n校验文档批次\n  -> 持久化原始文档字节\n  -> 读取已持久化原文件\n  -> 通过 ctx.documentParser 逐个解析\n  -> 校验并持久化 Markdown/content_list/提取图像\n  -> 检查本次提交的完整 Markdown 合计字节预算\n  -> 构建携带持久解析引用的 DocumentBlock\n  -> 追加/排队用户消息\n```'
          en_block = '```text\nvalidate document batch\n  -> persist original document bytes\n  -> read the persisted originals\n  -> parse each document through ctx.documentParser\n  -> validate and persist Markdown/content_list/extracted images\n  -> check aggregate complete Markdown byte budget for the submitted message\n  -> build DocumentBlock values carrying durable parsed refs\n  -> append/queue the user message\n```'
          r('.agents/notes/implemented/feature/2026-08-24-mineru-document-parsing.zh.md', zh_block, en_block)
          r('docs/subsystems/llm-streaming.md', 'interface LlmModelContext {\n  /** Maximum combined request and response context, when disclosed. */\n  contextWindow: number\n}', 'interface LlmModelContext {\n  /** Maximum combined request and response context in tokens. */\n  contextWindow: number\n}')
          r('docs/subsystems/llm-streaming.zh.md', 'interface LlmModelInfo {\n  /** Provider route that owns this model entry. */\n  provider: string\n  /** Model id passed to {@link GenerateOptions.model}. */\n  id: string\n  /** Human-readable model name for selectors and diagnostics. */\n  name: string', 'interface LlmModelInfo {\n  /** Provider route that owns this model entry. */\n  provider: string\n  /** Model id passed to {@link GenerateOptions.model}. */\n  id: string\n  /** Human-readable model name for selectors. */\n  name: string')
          PY
      - name: Generate repository-owned artifacts
        shell: bash
        run: |
          pnpm run gen-cordis-catalog
          pnpm run gen-client-catalog
          pnpm run gen-config-catalog
          pnpm run gen-doc-graphs
          pnpm run gen-module-graph
          pnpm run verify-translation-pairing --write docs/subsystems/llm-streaming.md
          pnpm run verify-translation-pairing --write .agents/notes/implemented/feature/2026-08-24-mineru-document-parsing.md
          pnpm run verify-translation-pairing --write packages/attachment/document-parser/README.md
          pnpm run verify-translation-pairing --write packages/attachment/document-parser-mineru/README.md
      - name: Restore temporary workflow
        shell: bash
        run: git show "${CLEAN_BASE}:.github/workflows/issue-lifecycle.yml" > .github/workflows/issue-lifecycle.yml
      - name: Validate corrected tree
        shell: bash
        run: |
          pnpm run build
          pnpm exec vitest run \
            packages/attachment/document-parser/tests/runtime.spec.ts \
            packages/attachment/document-parser-mineru/tests/provider.spec.ts \
            packages/attachment/document-parser-mineru/tests/transport.spec.ts \
            packages/attachment/document-parser-mineru/tests/loader-composition.spec.ts \
            packages/host/apiproxy/tests/api-proxy-document-parsing.spec.ts \
            packages/llm/llm/tests/parsed-document-content.spec.ts \
            packages/llm/llm-deepseek/tests/parsed-document-adapter.spec.ts \
            packages/llm/llm-pi-ai/tests/parsed-document-adapter.spec.ts
          pnpm run check:ci:static
      - name: Commit verified generated tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(documents): close MinerU static and generated gates'
      - name: Refuse concurrent overwrite
        shell: bash
        run: |
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${HEAD_REF}" | cut -f1)"
          test "${REMOTE_HEAD}" = "${EXPECTED_HEAD}"
      - name: Push verified tree
        shell: bash
        run: git push origin "HEAD:refs/heads/${HEAD_REF}"
