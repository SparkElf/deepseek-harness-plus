name: Attachment fixture patch

on:
  push:
    branches:
      - feat/document-attachments
    paths:
      - .github/workflows/attachment-fixture-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact fixture patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/client/connection/src/client/fixture.ts')
          text = path.read_text()

          old_import = "import type { AttachmentIdType, ImageAttachmentRef } from '@deepseek-ai/dsh-attachment'"
          new_import = "import type { AttachmentIdType, DocumentAttachmentRef, ImageAttachmentRef } from '@deepseek-ai/dsh-attachment'"
          if text.count(old_import) != 1:
              raise SystemExit('fixture attachment import did not match exactly once')
          text = text.replace(old_import, new_import)

          old = '''        const durable: ContentBlock[] = content.map((block) => {
            if (block.type === 'text') return block
            const attachment: ImageAttachmentRef = {
              attachmentId: `fixture:${randomUuid()}` as AttachmentIdType,
              mediaType: block.mediaType,
              bytes: Math.max(
                1,
                Math.floor(block.data.length * 3 / 4)
                - (block.data.endsWith('==') ? 2 : block.data.endsWith('=') ? 1 : 0),
              ),
              width: 160,
              height: 90,
              ...block.name === undefined ? {} : { name: block.name },
            }
            attachments.set(String(attachment.attachmentId), { attachment, data: block.data })
            return { type: 'image', attachment }
          })'''
          new = '''        const durable: ContentBlock[] = content.map((block) => {
            if (block.type === 'text') return block
            const attachmentId = `fixture:${randomUuid()}` as AttachmentIdType
            const bytes = Math.max(
              1,
              Math.floor(block.data.length * 3 / 4)
              - (block.data.endsWith('==') ? 2 : block.data.endsWith('=') ? 1 : 0),
            )
            if (block.type === 'image') {
              const attachment: ImageAttachmentRef = {
                attachmentId,
                mediaType: block.mediaType,
                bytes,
                width: 160,
                height: 90,
                ...block.name === undefined ? {} : { name: block.name },
              }
              attachments.set(String(attachment.attachmentId), { attachment, data: block.data })
              return { type: 'image', attachment }
            }
            const attachment: DocumentAttachmentRef = {
              attachmentId,
              mediaType: block.mediaType,
              bytes,
              name: block.name,
            }
            return { type: 'document', attachment }
          })'''
          if text.count(old) != 1:
              raise SystemExit('fixture durable attachment block did not match exactly once')
          path.write_text(text.replace(old, new))
          PY

      - name: Commit source patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/attachment-fixture-patch.yml
          git add packages/client/connection/src/client/fixture.ts
          git diff --cached --check
          git commit -m 'fix(connection): preserve document attachment kind in fixture'
          git push origin HEAD:feat/document-attachments
