name: Sync Desktop Installer

on:
  workflow_dispatch:
    inputs:
      desktop_tag:
        description: Desktop release tag to download
        required: true
        type: string
      plus_tag:
        description: Empty Plus product release tag to update
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Download the Windows Desktop installer
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_TAG: ${{ inputs.desktop_tag }}
        run: |
          mkdir desktop-assets
          gh release download "$DESKTOP_TAG" --repo SparkElf/dsh-plus-desktop --dir desktop-assets --pattern "*.exe"
          test "$(find desktop-assets -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1
          test "$(find desktop-assets -maxdepth 1 -type f | wc -l)" -eq 1
      - name: Require an empty Plus product Release
        env:
          GH_TOKEN: ${{ github.token }}
          PLUS_TAG: ${{ inputs.plus_tag }}
        run: test "$(gh release view "$PLUS_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets | length")" -eq 0
      - name: Upload the Windows Desktop installer
        env:
          GH_TOKEN: ${{ github.token }}
          PLUS_TAG: ${{ inputs.plus_tag }}
        run: gh release upload "$PLUS_TAG" desktop-assets/*.exe --repo "$GITHUB_REPOSITORY"
      - name: Verify the published asset inventory
        env:
          GH_TOKEN: ${{ github.token }}
          PLUS_TAG: ${{ inputs.plus_tag }}
        run: |
          test "$(gh release view "$PLUS_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets | length")" -eq 1
          gh release view "$PLUS_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[0].name" | grep -E "^DeepSeek\.Harness\.Plus\.Setup\..+\.exe$"
