- id: connection
  config:
    trustedHosts: !!js ctx.webRuntime.trustedHosts
    browserAuthentication: disabled

# The derived index behind session history search. `first-search` builds it when a
# search first asks for it rather than delaying every start.
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('storages/session-query.sqlite')
    openAt: first-search

# The model-facing tools over that index: search, trace, and event read. The
# backend above answers only once something mounts the tools that call it, so a
# deployment carrying the backend alone has an index nothing asks for.
- insert:
    - id: plus-session-query-tool
      name: '@deepseek-ai/dsh-tool-session-query'
    # The sidebar skill center. It reads the loaded skills through `ctx.skills`
    # and registers its row and page into the shell's own slots, so the panel
    # matches the official panels beside it.
    - id: plus-skill-center
      name: '@sparkelf/dsh-client-ui-skill-center'

    - id: plus-backup
      name: '@sparkelf/dsh-plugin-backup'

    # DataOps tools belong to the DataOps-managed workspace profile only. A
    # standalone profile must not carry DataOps identity or endpoint config, so
    # this layer mounts no DataOps plugin.

    # Subagent Settings was retired at DSH 0.1.7-rc.1. The official distribution moved the
    # browser settings service from settingsScope to configForms and ships its own
    # @deepseek-ai/dsh-client-ui-settings-subagent, which dsh-web-app mounts directly. The
    # third-party plugin still injects settingsScope, so it never activates, and a pending
    # client entry fails the whole browser boot with "Failed to load plugins". Agent teams
    # own delegation in this profile, so nothing here needs that section.

# Reminders are a default Plus capability. Official ships the three rows disabled in
# its own bundle layer, so a deployment that wants them writes its own patch; making it
# a Plus default means every consumer receives them without repeating that layer. The
# rows are re-enabled rather than re-inserted: `applyEntryPatches` copies every
# override key onto the row an earlier layer inserted, so this layer reaches the
# official rows without duplicating their names.
#
# The three move together. `time-context` supplies the sampling instant, the browser
# zone, and the elapsed time that let the model turn a reminder request such as
# "tomorrow at nine" into an offset-bearing `at` value; without it the model has no
# clock of its own and an unqualified time depends on a separate source. `ui-schedule`
# carries the Automation tasks page, the Session-header clock, and the right-Sidebar
# task tab over the Host service `schedule` mounts.
- id: time-context
  disabled: false

- id: schedule
  disabled: false

- id: ui-schedule
  disabled: false

# The first content search builds the whole index in one transaction, so it needs far
# more than a steady-state query. This row follows the insert above because a patch
# only reaches rows an earlier patch created.
- id: plus-session-query-tool
  config:
    searchTimeoutMs: 900000

# Chinese government documents name 方正小标宋 / 仿宋GB2312 / 楷体GB2312 / 黑体, none of which
# ship with the conversion kit. The official provider indexes absolute host directories and
# reports the families it could not find, so the fonts are installed once and named here
# rather than patched into the conversion code: a directory the deployment supplies is the
# extension point official DSH already owns, and it survives a DSH upgrade.
- id: office-to-pdf
  config:
    fontDirectories: !!js "process.env.DSH_OFFICE_FONT_DIR ? [process.env.DSH_OFFICE_FONT_DIR] : undefined"
    fontFallbacks: !!js "[[\"FZXiaoBiaoSong-B05S\",\"方正小标宋简体\",\"FangSong_GB2312\",\"仿宋_GB2312\",\"KaiTi_GB2312\",\"楷体_GB2312\",\"SimHei\",\"黑体\"]]"
