<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      html, body { width: 512px; height: 512px; margin: 0; background: #111318; }
      .tile { width: 512px; height: 512px; background: #111318; display: grid; place-items: center; }
      .ring { width: 250px; height: 250px; border: 34px solid #ffffff; border-radius: 50%; position: relative; }
      .signal { position: absolute; width: 86px; height: 86px; right: -72px; bottom: -72px; background: #2f75df; border: 18px solid #111318; }
    </style>
  </head>
  <body><div class="tile"><div class="ring"><div class="signal"></div></div></div></body>
</html>
