- id: dataops-managed
  name: "@sparkelf/dsh-dataops-managed"
  config:
    toolCallTimeoutMs: 90000
# The DataOps data-query MCP server speaks to the backend with the workspace's credential. A
# group-chat room resolves its own scoped entry instead (DATAOPS_ACCESS_TOKEN_S_<SID>), which the
# connector mints per room; the bridge falls back to this base ref while a room's entry is absent
# or expired, so a workspace that never joins a room behaves exactly as before.
- id: dataops-data-query-mcp
  name: "@sparkelf/dsh-plugin-mcp-credentials"
  config:
    transport: streamable-http
    serverName: data-query
    url: !!js process.env.DATAOPS_AI_WORKSPACE_BACKEND_BASE_URL + '/api/ai/data-query/mcp'
    bearerTokenRef: DATAOPS_ACCESS_TOKEN
