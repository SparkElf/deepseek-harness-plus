        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
            config:
              interrupt: false
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelection: true
              modelDiscovery: true
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
          - id: workflow-ptc
            name: '@deepseek-ai/dsh-workflow-ptc'
            config:
              provider: spawn
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'
            disabled: true
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: tool-cordis
        name: '@deepseek-ai/dsh-tool-cordis'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
        config:
          customSkillDirs:
            - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      - id: tool-plugin-manager
        name: '@deepseek-ai/dsh-plugin-manager/tools'
        disabled: !!js "!ctx.get('profileContext')"
      - id: tool-plugin-market
        name: '@deepseek-ai/dsh-plugin-market/tools'
        disabled: !!js "!ctx.get('profileContext')"

# IM 机器人集中管理（admin 模式）：只注册 DSH 设置页与同源代理，不加载 IM 通道、不注册工具。
# 普通成员的设置页里没有这一项（前端按 `/api/im/capability` 的结果决定是否注册），
# 后端 `/api/im/*` 另由 `system:im:manage` 把关。
- insert:
    - id: dataops-im
      name: "@sparkelf/dsh-dataops-im"
      config:
        mode: admin
        baseUrl: !!js process.env.DATAOPS_AI_WORKSPACE_BACKEND_BASE_URL


# 万相文档处理：通用 office/office-docx 技能与 OfficeCLI 的 word/excel/pptx 重复，禁用
# dsh-skill-office；Excel 重算仍由 dsh-tool-office 的 office_recalculate 负责。
- id: skill-office
  disabled: true

# officecli-pdf 导出桥允许 600s；office-kit 默认 60s 会先超时，这里放大到同一上限。
# 预览与导出共用 provider，只放大上限，不改变并发与语义。
- id: office-kit
  config:
    timeoutMs: 600000
    maxInputBytes: 104857600
    maxSourceBytes: 104857600
    maxConcurrentConversions: 2
